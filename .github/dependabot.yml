version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    # 1.7 removed the mcp plugin the MCP endpoint authenticates with; see BACKLOG.md.
    ignore:
      - dependency-name: "better-auth"
        versions: [">=1.7.0"]
      # Past 1.59, some server-action responses never report finished, so e2e settle() times out; see BACKLOG.md.
      - dependency-name: "@playwright/test"
        versions: [">=1.60.0"]
      # 6.16 trips a WebKit blob error in the e2e on Playwright 1.59's WebKit; lifts with Playwright.
      - dependency-name: "maplibre-gl"
        versions: [">=6.16.0"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    groups:
      docker:
        patterns: ["*"]
