version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps):"
    groups:
      github-actions:
        update-types: ["minor", "patch"]
        patterns: ["*"]
      # The auto-merge workflow reads this exact group name.
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps):"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps):"
    groups:
      docker:
        update-types: ["minor", "patch"]
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    # Stay on the LTS line; odd-numbered Node majors are never LTS.
    ignore:
      - dependency-name: "node"
        versions: [">=25.0.0"]
