version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    # 1.7 removed the mcp plugin the MCP endpoint authenticates with; see BACKLOG.md.
    ignore:
      - dependency-name: "better-auth"
        versions: [">=1.7.0"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    groups:
      docker:
        patterns: ["*"]
    # Stay on the LTS line; odd-numbered Node majors are never LTS.
    ignore:
      - dependency-name: "node"
        versions: [">=25.0.0"]
