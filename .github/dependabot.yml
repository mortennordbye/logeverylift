version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    groups:
      github-actions:
        patterns: ["*"]
      # Security fixes ignore version-update groups unless a group opts in, so
      # without this every advisory arrives as its own PR.
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    # Skip releases younger than this. Avoids churning on a .0 that gets pulled
    # or patched days later. Security updates ignore the cooldown.
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    groups:
      docker:
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
