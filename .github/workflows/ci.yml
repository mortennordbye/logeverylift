name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege by default; the build job opts into packages:write.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the in-flight run — also stops
# two rapid pushes from racing to stamp `latest` on ghcr out of order.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    # This name is a required status check in the repo ruleset; renaming the
    # job leaves the required check unreported and every PR blocked.
    name: Typecheck + tests
    runs-on: ubuntu-latest
    # The integration tests run Server Actions against a real Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The rest of `pnpm verify`, which used to run only in the local pre-push
      # hook, so a push with --no-verify skipped them entirely.
      - name: Lint
        run: pnpm lint

      - name: Doc claims
        run: pnpm check:docs

      # Unit and integration projects together, so coverage counts both.
      - name: Unit + integration tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # The suite is split across two machines (Playwright --shard), each running
  # two workers with its own e2e accounts.
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Browsers and their system libraries come preinstalled, so there is no
    # install step: `playwright install-deps` alone once took 9 minutes on a
    # slow apt mirror. The tag must match @playwright/test in pnpm-lock.yaml;
    # the first step below fails if they drift apart (a Dependabot bump).
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logeverylift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Playwright matches the container image
        run: |
          want="$(pnpm exec playwright --version | awk '{print $2}')"
          test "$want" = "1.59.1" || { echo "@playwright/test is $want; update the container image tag to v$want"; exit 1; }

      # playwright.config.ts starts the server itself: prepares the test
      # database, builds, and serves the standalone production build.
      - name: E2E
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/logeverylift_test

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # One check for the shards under the name the repo ruleset requires.
  e2e:
    name: E2E (WebKit + Chromium)
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: ${{ always() }}
    steps:
      - name: All shards passed
        run: |
          echo "shards: ${{ needs.e2e-shard.result }}"
          test "${{ needs.e2e-shard.result }}" = "success"

  build:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    # Image only builds when tests pass — a red verify or e2e must never ship a `latest`
    # tag. Kargo (not this workflow) promotes the pushed image via a homelab PR.
    needs: [verify, e2e]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Buildx with a docker-container driver is required for the GHA cache
      # backend below — the default docker driver can't export cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            # Monotonic SemVer tag the Kargo Warehouse selects (like portfolio/blog).
            type=raw,value=0.0.${{ github.run_number }},enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          # PRs build the image to catch Dockerfile breakage but never push.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the GitHub Actions cache backend: pnpm install only
          # re-runs when package.json/pnpm-lock.yaml change. mode=max also
          # caches intermediate stages (deps/builder), not just the final image.
          cache-from: type=gha
          cache-to: type=gha,mode=max
