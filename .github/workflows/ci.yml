name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
    # A documentation-only push must not produce an image. Every image pushed
    # from main gets a `0.0.N` tag, which Kargo promotes and ArgoCD rolls out —
    # restarting the pod. In-flight PWA sessions then hold client chunks whose
    # Server Action IDs the new server may not recognise, so a docs commit can
    # break someone mid-workout for no shipped change.
    #
    # Semantics: the run is skipped only when EVERY changed path matches. A
    # commit touching both a doc and `src/` still builds. `pull_request` is
    # deliberately left unfiltered so docs PRs are still typechecked and tested.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"
  workflow_dispatch:

# Least privilege by default; the build job opts into packages:write.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the in-flight run — also stops
# two rapid pushes from racing to stamp `latest` on ghcr out of order.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    # Image only builds when tests pass — a red verify must never ship a `latest`
    # tag. Kargo (not this workflow) promotes the pushed image via a homelab PR.
    needs: verify
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Buildx with a docker-container driver is required for the GHA cache
      # backend below — the default docker driver can't export cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pushed image with a build-specific Server Action key breaks every
      # in-flight PWA session on the next deploy, silently — the failed writes
      # land in the replay queue, retry 5x and get dropped. Fail loudly here
      # instead of discovering it from a user mid-workout.
      - name: Require a stable Server Action key for pushed images
        if: github.event_name != 'pull_request'
        env:
          SERVER_ACTIONS_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          if [ -z "$SERVER_ACTIONS_KEY" ]; then
            echo "::error::NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is not set as a repository secret."
            echo "::error::It must match the value in the logeverylift-secret k8s Secret exactly."
            exit 1
          fi

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            # Monotonic SemVer tag the Kargo Warehouse selects (like portfolio/blog).
            type=raw,value=0.0.${{ github.run_number }},enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          # PRs build the image to catch Dockerfile breakage but never push.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Consumed by the builder stage via `--mount=type=secret`. Keeps
          # Server Action IDs identical across builds, so a deploy doesn't
          # invalidate the action IDs a cached PWA bundle is still calling.
          secrets: |
            server_actions_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          # Layer cache in the GitHub Actions cache backend: pnpm install only
          # re-runs when package.json/pnpm-lock.yaml change. mode=max also
          # caches intermediate stages (deps/builder), not just the final image.
          cache-from: type=gha
          cache-to: type=gha,mode=max
