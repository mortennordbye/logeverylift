<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select and delete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0c}
a{color:#6b95ff;text-decoration:none}a:hover{color:#8fb0ff}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #0b0b0c; color: #f4f4f5; font-family: 'Work Sans', system-ui, sans-serif; display: flex; flex-direction: column; position: relative">

  <header style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; padding: 16px 8px 8px">
    <button style="justify-self: start; min-height: 44px; padding: 0 8px; border: none; background: transparent; color: {{accent}}; font: 500 16px 'Work Sans', sans-serif">Cancel</button>
    <span style="justify-self: center; font-size: 16px; font-weight: 600">2 selected</span>
    <button style="justify-self: end; min-height: 44px; padding: 0 8px; border: none; background: transparent; color: {{accent}}; font: 500 16px 'Work Sans', sans-serif">Select all</button>
  </header>

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 8px 16px 0">
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 20px; background: #161618">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 16px; font-weight: 600">Jevnaker Half 2027</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8d8d93" stroke-width="2" stroke-linecap="round" role="img" aria-label="Season cannot be selected here"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      </div>
      <span style="font-size: 13px; color: #8d8d93">Delete a season from its ⋯ menu.</span>
    </div>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #8d8d93">Phases</h2>
      <div style="display: flex; flex-direction: column; border-radius: 20px; background: #161618; overflow: hidden">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
          <label style="display: flex; align-items: center; gap: 12px; padding: 6px 16px 6px 8px; min-height: 56px; box-sizing: border-box; border-bottom: 1px solid rgba(244,244,245,0.08)">
            <span style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
              <span style="width: 26px; height: 26px; border-radius: 13px; box-sizing: border-box; border: {{r.ring}}; background: {{r.fill}}; display: flex; align-items: center; justify-content: center">
                <sc-if value="{{r.checked}}" hint-placeholder-val="{{ false }}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0b0b0c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
                </sc-if>
              </span>
            </span>
            <input type="checkbox" checked="{{r.checked}}" aria-label="{{r.aria}}" style="position: absolute; opacity: 0; width: 1px; height: 1px">
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-size: 15px; font-weight: 500">{{r.name}}</span>
              <span style="font-size: 13px; color: #8d8d93">{{r.sub}}</span>
            </div>
          </label>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #8d8d93">Past cycles</h2>
      <label style="display: flex; align-items: center; gap: 12px; padding: 6px 16px 6px 8px; min-height: 56px; box-sizing: border-box; border-radius: 20px; background: #161618">
        <span style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><span style="width: 26px; height: 26px; border-radius: 13px; box-sizing: border-box; border: 2px solid #707076"></span></span>
        <input type="checkbox" aria-label="Select Intro" style="position: absolute; opacity: 0; width: 1px; height: 1px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 500">Intro</span>
          <span style="font-size: 13px; color: #8d8d93">4 weeks · ended 8 Nov</span>
        </div>
      </label>
    </section>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #111113; border-top: 1px solid rgba(244,244,245,0.08); padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 10px">
    <p role="note" style="margin: 0; font-size: 14px; line-height: 20px; color: #f4f4f5">Both are phases of Jevnaker Half 2027. The later phases move 168 days earlier, so the taper will end before race day. You will need to re-plan.</p>
    <button style="height: 52px; border: none; border-radius: 16px; background: #c23a2e; color: #ffffff; font: 600 16px 'Work Sans', sans-serif">Delete 2 cycles</button>
    <span style="font-size: 13px; color: #8d8d93; text-align: center">You can restore them for 90 days.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6b95ff","options":["#6b95ff","#5fbf8f","#ff8a3d","#f4f4f5"]},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6b95ff';
    const off = { checked: false, ring: '2px solid #707076', fill: 'transparent' };
    const on = { checked: true, ring: '2px solid ' + accent, fill: accent };
    const r = (name, sub, s) => ({ name, sub, aria: 'Select ' + name, ...s });
    return {
      accent,
      rows: [
        r('Aerobic base + strength', 'General · 8 wk · 16 Nov – 10 Jan', off),
        r('Longer ride and run', 'Base · 12 wk · 11 Jan – 4 Apr', on),
        r('Swim, intervals, bricks', 'Build · 12 wk · 5 Apr – 27 Jun', on),
        r('Race pace + open water', 'Build · 53 days · 28 Jun – 19 Aug', off),
        r('Taper', 'Taper · 10 days · 20 – 29 Aug', off)
      ]
    };
  }
}
</script>
</body>
</html>
