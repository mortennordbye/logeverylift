<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick a program</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0c}
a{color:#6b95ff;text-decoration:none}a:hover{color:#8fb0ff}
input::placeholder{color:#8d8d93}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #0b0b0c; color: #f4f4f5; font-family: 'Work Sans', system-ui, sans-serif; position: relative; overflow: hidden">

  <!-- rotation builder behind -->
  <div style="padding: 60px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 22px; font-weight: 600">Rotation order</span>
    <div style="height: 280px; border-radius: 16px; background: #161618"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.6)"></div>

  <section aria-label="Pick a program" style="position: absolute; left: 0; right: 0; bottom: 0; height: 680px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 10px 16px 24px; border-radius: 20px 20px 0 0; background: #161618">
    <span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #3a3a3e"></span>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 17px; font-weight: 600">Pick a program</h2>
      <button aria-label="Close" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #222225; color: #c4c4c9; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 12px; background: #222225">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8d8d93" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="search" aria-label="Search programs" placeholder="Search programs" style="flex: 1; border: none; background: transparent; color: #f4f4f5; font: 400 16px 'Work Sans', sans-serif; outline: none">
    </label>

    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; border-radius: 16px; background: #222225; overflow: hidden">
      <sc-for list="{{programs}}" as="p" hint-placeholder-count="6">
        <li style="border-bottom: 1px solid rgba(244,244,245,0.08)">
          <button style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; min-height: 56px; border: none; background: {{p.bg}}; color: #f4f4f5; text-align: left; font-family: 'Work Sans', sans-serif">
            <span style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 500">{{p.name}}</span>
              <span style="font-size: 13px; color: #8d8d93">{{p.sub}}</span>
            </span>
            <sc-if value="{{p.sel}}" hint-placeholder-val="{{ false }}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Selected"><path d="M5 12l5 5L20 7"></path></svg>
            </sc-if>
          </button>
        </li>
      </sc-for>
      <li>
        <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 0 16px; min-height: 52px; font-size: 15px; font-weight: 500; color: {{accent}}">+ New program</a>
      </li>
    </ul>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6b95ff","options":["#6b95ff","#5fbf8f","#ff8a3d","#f4f4f5"]},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const n = 'transparent';
    return {
      accent: this.props.accent ?? '#6b95ff',
      programs: [
        { name: 'Upper A', sub: '6 exercises', bg: n, sel: false },
        { name: 'Lower A', sub: '5 exercises', bg: 'rgba(107,149,255,0.18)', sel: true },
        { name: 'Upper B', sub: '6 exercises', bg: n, sel: false },
        { name: 'Lower B', sub: '5 exercises', bg: n, sel: false },
        { name: 'Full body', sub: '7 exercises', bg: n, sel: false },
        { name: 'Easy run', sub: '1 exercise', bg: n, sel: false }
      ]
    };
  }
}
</script>
</body>
</html>
