<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New cycle basics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0c}
a{color:#6b95ff;text-decoration:none}a:hover{color:#8fb0ff}
input::placeholder{color:#8d8d93}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #0b0b0c; color: #f4f4f5; font-family: 'Work Sans', system-ui, sans-serif; display: flex; flex-direction: column; position: relative">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 8px 0">
    <a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 8px; font-size: 16px; color: {{accent}}">Cancel</a>
    <span style="font-size: 16px; font-weight: 600">New cycle</span>
    <span style="width: 70px"></span>
  </header>

  <div style="display: flex; flex-direction: column; gap: 22px; padding: 12px 16px 0">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #8d8d93">Step 1 of 2</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; height: 4px">
        <div style="border-radius: 2px; background: {{accent}}"></div>
        <div style="border-radius: 2px; background: #707076"></div>
      </div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #8d8d93">Name</span>
      <input type="text" placeholder="For example: Upper / Lower hypertrophy" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(244,244,245,0.12); background: #161618; color: #f4f4f5; font: 400 16px 'Work Sans', sans-serif">
    </label>

    <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
      <legend style="margin-bottom: 8px; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #8d8d93">How do you train?</legend>
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
        <label style="display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 14px; background: #161618; border: {{m.border}}">
          <span style="width: 22px; height: 22px; border-radius: 11px; box-sizing: border-box; border: {{m.ring}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px">
            <span style="width: 10px; height: 10px; border-radius: 5px; background: {{m.dot}}"></span>
          </span>
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 600">{{m.title}}</span>
            <span style="font-size: 13px; color: #8d8d93">{{m.sub}}</span>
          </span>
        </label>
      </sc-for>
    </fieldset>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
        <legend style="margin-bottom: 8px; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #8d8d93">{{g.label}}</legend>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{g.chips}}" as="c" hint-placeholder-count="4">
            <button aria-pressed="{{c.pressed}}" style="height: 44px; padding: 0 14px; border-radius: 22px; border: {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: 500 14px 'Work Sans', sans-serif">{{c.label}}</button>
          </sc-for>
        </div>
      </fieldset>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px 28px; background: #111113; border-top: 1px solid rgba(244,244,245,0.08)">
    <button style="width: 100%; height: 52px; border: none; border-radius: 16px; background: {{accent}}; color: #0b0b0c; font: 600 16px 'Work Sans', sans-serif">Next: put the sessions in order</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6b95ff","options":["#6b95ff","#5fbf8f","#ff8a3d","#f4f4f5"]},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6b95ff';
    const on = { border: '1px solid ' + accent, bg: 'rgba(107,149,255,0.18)', fg: '#f4f4f5' };
    const off = { border: '1px solid rgba(244,244,245,0.12)', bg: 'transparent', fg: '#c4c4c9' };
    const chip = (label, sel) => ({ label, pressed: sel ? 'true' : 'false', ...(sel ? on : off) });
    return {
      accent,
      modes: [
        { title: 'Same days each week', sub: 'Monday upper, Thursday lower', border: '1px solid rgba(244,244,245,0.12)', ring: '2px solid #707076', dot: 'transparent' },
        { title: 'Rotation', sub: 'The next session follows the last one. No fixed days.', border: '1px solid ' + accent, ring: '2px solid ' + accent, dot: accent }
      ],
      groups: [
        { label: 'Length', chips: [chip('4 weeks'), chip('6 weeks', true), chip('8 weeks'), chip('12 weeks'), chip('Custom')] },
        { label: 'Start', chips: [chip('Today', true), chip('Next Monday · 16 Nov'), chip('Pick a date'), chip('After current cycle')] },
        { label: 'When it ends', chips: [chip('Just stop', true), chip('Deload week'), chip('Start a new cycle'), chip('Rest period')] }
      ]
    };
  }
}
</script>
</body>
</html>
