<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cycle detail, rotation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0c}
a{color:#6b95ff;text-decoration:none}a:hover{color:#8fb0ff}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #0b0b0c; color: #f4f4f5; font-family: 'Work Sans', system-ui, sans-serif; display: flex; flex-direction: column; position: relative">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 8px 0">
    <a href="#" style="display: flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px; color: {{accent}}; font-size: 16px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Plan</a>
    <button aria-label="More actions" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #161618; color: #f4f4f5; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
    </button>
  </header>

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 8px 16px 0">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 34px; line-height: 36px; text-transform: uppercase">Upper / Lower hypertrophy</h1>
      <span style="font-size: 14px; color: #8d8d93">Rotation · 6 weeks · Week 3 of 6</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 20px; background: #161618">
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; height: 10px">
        <div style="border-radius: 4px; background: {{accent}}"></div>
        <div style="border-radius: 4px; background: {{accent}}"></div>
        <div style="border-radius: 4px; background: {{accent}}; box-shadow: 0 0 0 2px #161618, 0 0 0 4px {{accent}}"></div>
        <div style="border-radius: 4px; background: #707076"></div>
        <div style="border-radius: 4px; background: #707076"></div>
        <div style="border-radius: 4px; background: #707076"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #8d8d93">
        <span>Started 9 Nov</span><span>Ends 20 Dec</span>
      </div>
    </div>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #8d8d93">Order</h2>
        <a href="#" style="min-height: 44px; display: flex; align-items: center; font-size: 15px; color: {{accent}}">Edit order</a>
      </div>
      <div style="display: flex; flex-direction: column; border-radius: 20px; background: #161618; overflow: hidden">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; border-bottom: 1px solid rgba(244,244,245,0.08)">
            <a href="#" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px 0 12px 16px; min-height: 44px; color: #f4f4f5">
              <span style="width: 28px; height: 28px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; background: {{r.numBg}}; color: {{r.numFg}}">{{r.n}}</span>
              <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                <span style="font-size: 15px; font-weight: 500; color: {{r.fg}}">{{r.name}}</span>
                <span style="font-size: 13px; color: {{r.subColor}}">{{r.sub}}</span>
              </div>
            </a>
            <button aria-label="{{r.menuLabel}}" style="width: 44px; height: 44px; margin-right: 6px; border: none; border-radius: 22px; background: transparent; color: #8d8d93; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
            </button>
          </div>
        </sc-for>
      </div>
      <p style="margin: 0 4px; font-size: 13px; color: #8d8d93">Repeats every 5 days. A missed session waits for you.</p>
    </section>

    <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 24px">
      <button style="min-height: 44px; border: none; background: transparent; color: #f4f4f5; font: 500 15px 'Work Sans', sans-serif; text-align: left; padding: 0 4px">Restart cycle</button>
      <button style="min-height: 44px; border: none; background: transparent; color: #ff6b5a; font: 500 15px 'Work Sans', sans-serif; text-align: left; padding: 0 4px">Delete cycle</button>
    </div>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #111113; border-top: 1px solid rgba(244,244,245,0.08); display: flex; justify-content: space-around; padding-top: 10px; box-sizing: border-box; font-size: 11px">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8d8d93; min-width: 64px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg>Workout</a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{accent}}; min-width: 64px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>Plan</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8d8d93; min-width: 64px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"></rect><path d="M14 5h6M14 9h6M4 15h16M4 19h16"></path></svg>Programs</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8d8d93; min-width: 64px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6b95ff","options":["#6b95ff","#5fbf8f","#ff8a3d","#f4f4f5"]},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6b95ff';
    const base = { numBg: '#222225', numFg: '#c4c4c9', fg: '#f4f4f5', subColor: '#8d8d93' };
    return {
      accent,
      rows: [
        { ...base, n: '1', name: 'Upper A', sub: 'Done Tue', menuLabel: 'Actions for Upper A' },
        { ...base, n: '2', name: 'Lower A', sub: 'Next', subColor: accent, numBg: accent, numFg: '#0b0b0c', menuLabel: 'Actions for Lower A' },
        { ...base, n: '3', name: 'Rest', sub: 'Rest day', fg: '#c4c4c9', menuLabel: 'Actions for rest day' },
        { ...base, n: '4', name: 'Upper B', sub: '5 exercises', menuLabel: 'Actions for Upper B' },
        { ...base, n: '5', name: 'Lower B', sub: '4 exercises', menuLabel: 'Actions for Lower B' }
      ]
    };
  }
}
</script>
</body>
</html>
