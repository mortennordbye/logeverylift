<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Empty Plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0c}
a{color:#6b95ff;text-decoration:none}a:hover{color:#8fb0ff}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #0b0b0c; color: #f4f4f5; font-family: 'Work Sans', system-ui, sans-serif; display: flex; flex-direction: column; position: relative">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 24px 16px 8px">
    <h1 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 40px; letter-spacing: 0.5px; text-transform: uppercase">Plan</h1>
    <button aria-label="New cycle or season" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: {{accent}}; color: #0b0b0c; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </header>

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 64px 16px 0">
    <section style="display: flex; flex-direction: column; gap: 20px; padding: 24px 20px; border-radius: 20px; background: #161618">
      <div style="display: flex; flex-direction: column; gap: 8px; text-align: center">
        <h2 style="margin: 0; font-size: 22px; font-weight: 600">Plan your training</h2>
        <p style="margin: 0; font-size: 15px; line-height: 21px; color: #c4c4c9">A cycle is a block of weeks that runs your programs.</p>
      </div>
      <div style="display: flex; flex-direction: column; border-radius: 14px; background: #222225; overflow: hidden">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid rgba(244,244,245,0.08)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c4c4c9" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 600">Same days each week</span>
            <span style="font-size: 13px; color: #8d8d93">Monday upper, Thursday lower</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c4c4c9" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"></path></svg>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 600">Rotation</span>
            <span style="font-size: 13px; color: #8d8d93">The next session follows the last one</span>
          </div>
        </div>
      </div>
      <button style="height: 52px; border: none; border-radius: 16px; background: {{accent}}; color: #0b0b0c; font: 600 16px 'Work Sans', sans-serif">New cycle</button>
    </section>

    <a href="#" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; font-size: 14px; color: #8d8d93">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 21V4M5 4h12l-2 4 2 4H5"></path></svg>
      Training for a race or a goal? Add a season
    </a>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #111113; border-top: 1px solid rgba(244,244,245,0.08); display: flex; justify-content: space-around; padding-top: 10px; box-sizing: border-box; font-size: 11px">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8d8d93; min-width: 64px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg>Workout</a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{accent}}; min-width: 64px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>Plan</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8d8d93; min-width: 64px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"></rect><path d="M14 5h6M14 9h6M4 15h16M4 19h16"></path></svg>Programs</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8d8d93; min-width: 64px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6b95ff","options":["#6b95ff","#5fbf8f","#ff8a3d","#f4f4f5"]},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#6b95ff' };
  }
}
</script>
</body>
</html>
