<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change one session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0c}
a{color:#6b95ff;text-decoration:none}a:hover{color:#8fb0ff}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #0b0b0c; color: #f4f4f5; font-family: 'Work Sans', system-ui, sans-serif; position: relative; overflow: hidden">

  <div aria-hidden="true" style="padding: 24px 16px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 16px; color: {{accent}}">‹ Plan</span>
    <span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 34px; text-transform: uppercase">Aerobic base + strength</span>
    <div style="height: 64px; border-radius: 20px; background: #161618"></div>
    <div style="height: 300px; border-radius: 20px; background: #161618"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.6)"></div>

  <section aria-label="Session on Tue 17 Nov" style="position: absolute; left: 0; right: 0; bottom: 0; background: #161618; border-radius: 20px 20px 0 0; padding: 8px 16px 28px; display: flex; flex-direction: column; gap: 14px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #3a3a3e"></span>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #8d8d93">Tue 17 Nov</span>
      <h2 style="margin: 0; font-size: 24px; font-weight: 600">Bike tempo · 60 min</h2>
      <a href="#" style="display: flex; align-items: center; min-height: 44px; font-size: 14px; color: #8d8d93">Phase 1 · General ·&#160;<span style="color: {{accent}}">See program ›</span></a>
    </div>

    <div style="display: flex; flex-direction: column; border-radius: 16px; background: #222225; overflow: hidden">
      <button aria-expanded="true" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 14px; border: none; background: transparent; color: #f4f4f5; font: 500 15px 'Work Sans', sans-serif">Move to another day<span aria-hidden="true" style="color: #8d8d93">⌄</span></button>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 10px 12px; border-bottom: 1px solid rgba(244,244,245,0.08)">
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
          <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
            <button aria-label="{{d.label}}" style="height: 52px; min-width: 0; border-radius: 12px; border: {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 600 13px 'Work Sans', sans-serif; padding: 0">
              <span>{{d.day}}</span><span style="font-size: 11px; font-weight: 500; color: {{d.sub}}">{{d.date}}</span>
            </button>
          </sc-for>
        </div>
        <span style="font-size: 12px; color: #8d8d93">Sun has a key session. You cannot pick a day in the past.</span>
      </div>
      <sc-for list="{{actions}}" as="a" hint-placeholder-count="3">
        <button style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 14px; border: none; border-bottom: 1px solid rgba(244,244,245,0.08); background: transparent; color: #f4f4f5; font: 500 15px 'Work Sans', sans-serif">{{a}}<span aria-hidden="true" style="color: #8d8d93">›</span></button>
      </sc-for>
      <button style="display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; min-height: 60px; padding: 8px 14px; border: none; border-bottom: 1px solid rgba(244,244,245,0.08); background: transparent; color: #f4f4f5; font: 500 15px 'Work Sans', sans-serif; text-align: left">Back to the template<span style="font-size: 13px; font-weight: 400; color: #8d8d93">This day was changed</span></button>
      <button style="display: flex; align-items: center; min-height: 52px; padding: 0 14px; border: none; background: transparent; color: #ff6b5a; font: 500 15px 'Work Sans', sans-serif">Skip this session</button>
    </div>

    <p style="margin: 0; font-size: 13px; color: #8d8d93">Only this day changes. The template stays the same.</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6b95ff","options":["#6b95ff","#5fbf8f","#ff8a3d","#f4f4f5"]},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6b95ff';
    const none = '1px solid transparent';
    const d = (day, date, o) => ({ day, date, label: day + ' ' + date + ' Nov', bg: '#161618', border: none, fg: '#f4f4f5', sub: '#8d8d93', ...o });
    return {
      accent,
      days: [
        d('Mon', '16'),
        d('Tue', '17', { bg: 'rgba(107,149,255,0.18)', fg: accent, sub: accent, label: 'Tue 17 Nov, current day' }),
        d('Wed', '18'),
        d('Thu', '19'),
        d('Fri', '20'),
        d('Sat', '21'),
        d('Sun', '22', { border: '1px solid ' + accent, label: 'Sun 22 Nov, key session' })
      ],
      actions: ['Swap program', 'Use a workout', 'Label and note']
    };
  }
}
</script>
</body>
</html>
