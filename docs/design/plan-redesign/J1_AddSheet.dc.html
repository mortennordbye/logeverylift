<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plus menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0c}
a{color:#6b95ff;text-decoration:none}a:hover{color:#8fb0ff}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #0b0b0c; color: #f4f4f5; font-family: 'Work Sans', system-ui, sans-serif; position: relative; overflow: hidden">

  <!-- empty Plan behind -->
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 24px 16px 8px">
    <h1 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 40px; letter-spacing: 0.5px; text-transform: uppercase">Plan</h1>
    <span style="width: 44px; height: 44px; border-radius: 22px; background: {{accent}}"></span>
  </header>
  <div style="margin: 64px 16px 0; height: 300px; border-radius: 20px; background: #161618"></div>

  <!-- dim -->
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.6)"></div>

  <!-- sheet -->
  <section aria-label="New" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 12px; padding: 10px 16px 32px; border-radius: 20px 20px 0 0; background: #161618">
    <span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #3a3a3e"></span>
    <h2 style="margin: 4px 4px 0; font-size: 17px; font-weight: 600">New</h2>
    <div style="display: flex; flex-direction: column; border-radius: 16px; background: #222225; overflow: hidden">
      <a href="#" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; min-height: 64px; box-sizing: border-box; border-bottom: 1px solid rgba(244,244,245,0.08); color: #f4f4f5">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 600">New cycle</span>
          <span style="font-size: 13px; color: #8d8d93">A block of weeks with your programs</span>
        </div>
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; min-height: 64px; box-sizing: border-box; color: #f4f4f5">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 21V4M5 4h12l-2 4 2 4H5"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 600">New season</span>
          <span style="font-size: 13px; color: #8d8d93">Training for a race or a goal</span>
        </div>
      </a>
    </div>
    <button style="height: 52px; border: none; border-radius: 16px; background: #222225; color: #f4f4f5; font: 600 16px 'Work Sans', sans-serif">Cancel</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6b95ff","options":["#6b95ff","#5fbf8f","#ff8a3d","#f4f4f5"]},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#6b95ff' };
  }
}
</script>
</body>
</html>
